<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Cuidado Pleno</title>

    <link rel="icon" type="image/png" href="asset/logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --roxo: #7442ad;
            --roxo-escuro: #39205b;
            --roxo-claro: #f1eafa;
            --branco: #ffffff;
            --texto: #30283a;
            --borda: #e5dced;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background-color: #f8f9fa;
            color: var(--texto);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--branco);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--roxo-claro);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { color: var(--roxo-escuro); margin: 0; font-size: 24px; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: var(--roxo-claro);
            color: var(--roxo);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .tab-btn.active {
            background: var(--roxo);
            color: var(--branco);
        }

        .actions {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .export-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover { background-color: #218838; }

        .delete-all-btn {
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            margin-right: 10px;
        }

        .delete-all-btn:hover { background-color: #c82333; }

        .btn-row-delete {
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-row-delete:hover { background-color: #c82333; }

        .file-link {
            display: inline-block;
            padding: 4px 8px;
            background: var(--roxo-claro);
            color: var(--roxo);
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            margin: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--borda);
        }

        th { background: var(--roxo-claro); color: var(--roxo-escuro); }

        .loading { text-align: center; padding: 40px; color: var(--roxo); font-weight: bold; }

        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--branco);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .login-box {
            text-align: center;
            padding: 40px;
            border: 1px solid var(--borda);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--borda);
            border-radius: 6px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--roxo);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Simples proteção por senha para não deixar os dados abertos -->
    <div id="loginOverlay">
        <div class="login-box">
            <img src="asset/logo1.png" alt="Logo" style="width: 80px; border-radius: 50%; margin-bottom: 20px;">
            <h2>Acesso Restrito</h2>
            <p>Insira a chave de acesso para visualizar os dados.</p>
            <input type="password" id="adminPassword" placeholder="Sua senha">
            <button class="btn-login" onclick="checkAuth()">Entrar</button>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>Painel de Controle - Cuidado Pleno</h1>
            <button onclick="logout()" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">Sair</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('contatos', this)">Contatos (Site)</button>
            <button class="tab-btn" onclick="switchTab('candidaturas', this)">Candidaturas (Trabalhe Conosco)</button>
        </div>

        <div class="actions">
            <button class="delete-all-btn" onclick="deleteAll()">
                🗑️ Apagar Tudo
            </button>
            <button class="export-btn" onclick="exportToExcel()">
                📊 Exportar para Excel (.xlsx)
            </button>
        </div>

        <div id="tableContainer">
            <div class="loading">Carregando dados...</div>
        </div>
    </div>

    <!-- Bibliotecas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://dekoqjzjheivlkctepne.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRla29xanpqaGVpdmxrY3RlcG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjk2NDUsImV4cCI6MjEwMDc0NTY0NX0.Ei4K2o1XaDQfGbCgnD3kXlummqro0vui2r9WHPg--1k';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentTab = 'contatos';
        let currentData = [];

        // Proteção simples (MUDE ESTA SENHA)
        const ADMIN_PASS = "Niu$2026";

        function checkAuth() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === ADMIN_PASS) {
                document.getElementById('loginOverlay').style.display = 'none';
                loadData();
            } else {
                alert("Senha incorreta!");
            }
        }

        function logout() {
            location.reload();
        }

        async function loadData() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '<div class="loading">Buscando informações no banco...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from(currentTab)
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                currentData = data;
                renderTable(data);
            } catch (err) {
                container.innerHTML = `<div style="color:red">Erro ao carregar: ${err.message}</div>`;
            }
        }

        function renderTable(data) {
            const container = document.getElementById('tableContainer');
            if (data.length === 0) {
                container.innerHTML = '<p>Nenhum registro encontrado.</p>';
                return;
            }

            let html = '<table><thead><tr>';

            // Cabeçalhos baseados nas chaves do primeiro objeto
            const headers = Object.keys(data[0]);
            headers.forEach(h => html += `<th>${h.toUpperCase()}</th>`);
            html += '<th>AÇÕES</th>'; // Nova coluna para ações
            html += '</tr></thead><tbody>';

            data.forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    let val = row[h] || '-';
                    if (h === 'created_at') {
                        val = new Date(val).toLocaleString('pt-BR');
                    } else if (h === 'arquivos_nomes' && val !== '-' && val !== 'Nenhum ficheiro anexado') {
                        const urls = val.split(', ');
                        val = urls.map((url, index) => {
                            // Se a URL não for completa, tenta montar com o caminho do Storage
                            const finalUrl = url.startsWith('http') ? url : `https://dekoqjzjheivlkctepne.supabase.co/storage/v1/object/public/documentos/${url}`;
                            return `<a href="${finalUrl}" target="_blank" class="file-link">Ver Ficheiro ${index + 1}</a>`;
                        }).join(' ');
                    }
                    html += `<td>${val}</td>`;
                });
                // Botão para excluir linha individual
                html += `<td><button class="btn-row-delete" onclick="deleteRow(${row.id})">Apagar</button></td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function deleteRow(id) {
            if (!confirm("Tem certeza que deseja apagar este registro?")) return;

            try {
                const { error } = await supabaseClient
                    .from(currentTab)
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                loadData();
            } catch (err) {
                alert("Erro ao apagar: " + err.message);
            }
        }

        async function deleteAll() {
            if (!confirm(`TEM CERTEZA QUE DESEJA APAGAR TODOS OS REGISTROS DE ${currentTab.toUpperCase()}? Esta ação é irreversível!`)) return;

            try {
                // No Supabase, para apagar tudo sem filtro, podemos usar um filtro que sempre seja verdadeiro
                const { error } = await supabaseClient
                    .from(currentTab)
                    .delete()
                    .neq('id', 0); // Filtro "id diferente de 0" (geralmente pega todos)

                if (error) throw error;
                loadData();
            } catch (err) {
                alert("Erro ao apagar tudo: " + err.message);
            }
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadData();
        }

        function exportToExcel() {
            if (currentData.length === 0) {
                alert("Não há dados para exportar.");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(currentData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, currentTab);

            const fileName = `Cuidado_Consciente_${currentTab}_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }
    </script>
</body>
</html>
